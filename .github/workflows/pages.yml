name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html app.js offerte.json offerte_arera.json _site/
          python -c "import json; d=json.load(open('offerte_arera.json',encoding='utf-8')); open('_site/arera_data.js','w',encoding='utf-8').write('window.ARERA_DATA='+json.dumps(d,ensure_ascii=False,separators=(',',':'))+';')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

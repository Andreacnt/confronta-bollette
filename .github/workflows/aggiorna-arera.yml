name: aggiorna-arera
# Manuale: il Portale Offerte blocca gli IP dei runner (403).
# Aggiorna da casa con python aggiorna_offerte_arera.py --inline arera_data.js e pusha.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python aggiorna_offerte_arera.py
      - run: |
          git config user.name "arera-bot"
          git config user.email "arera-bot@users.noreply.github.com"
          git add offerte_arera.json
          git diff --cached --quiet || git commit -m "data: aggiorna offerte ARERA"
          git push
